apply plugin: 'com.android.application'

def readConfig = { String key, def fallback = null ->
    def envValue = System.getenv(key)
    if (envValue != null && envValue.toString().trim()) {
        return envValue.toString().trim()
    }

    if (project.hasProperty(key)) {
        def propValue = project.property(key)?.toString()?.trim()
        if (propValue) {
            return propValue
        }
    }

    return fallback
}

def releaseStoreFile = readConfig('BURLIVE_UPLOAD_STORE_FILE')
def releaseStorePassword = readConfig('BURLIVE_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readConfig('BURLIVE_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readConfig('BURLIVE_UPLOAD_KEY_PASSWORD')
def releaseVersionName = readConfig('BURLIVE_VERSION_NAME')
def releaseVersionCodeRaw = readConfig('BURLIVE_VERSION_CODE')
def releaseVersionCode = null

if (releaseVersionCodeRaw) {
    try {
        releaseVersionCode = Integer.parseInt(releaseVersionCodeRaw)
    } catch (Exception ignored) {
        println("Invalid BURLIVE_VERSION_CODE='${releaseVersionCodeRaw}', using default versionCode")
    }
}

android {
    namespace = "ru.burlive.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "ru.burlive.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode ?: 2
        versionName releaseVersionName ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // Фиксированный ключ для debug/sideload-сборок — чтобы APK обновлялся поверх
        // предыдущего (иначе CI генерит новый debug-ключ каждый раз → "подпись не совпадает").
        debug {
            storeFile file('burlive-debug.keystore')
            storePassword 'burlive123'
            keyAlias 'burlive'
            keyPassword 'burlive123'
        }
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            } else {
                println('Release signing credentials are not configured. Building unsigned release artifacts.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
