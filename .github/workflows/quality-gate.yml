name: Quality Gate
on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:changed
      - run: npm test
      - run: npm run build:web && npm run size:check
      - run: npm run build:android && npm run size:check
