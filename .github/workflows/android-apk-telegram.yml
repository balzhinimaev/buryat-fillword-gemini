name: Android Debug APK (artifact + optional Telegram)

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Optional custom label (e.g. beta-2026-03-01)'
        required: false
        type: string
      publish_telegram:
        description: 'Send APK to Telegram (signed internal build)'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - master
  schedule:
    # Nightly build (UTC)
    - cron: '15 2 * * *'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DEBUG_APK_OUTPUT_PATH: android/app/build/outputs/apk/debug/app-debug.apk
      RELEASE_APK_OUTPUT_PATH: android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Prepare build metadata
        id: meta
        run: |
          set -euo pipefail

          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          EVENT_NAME="${GITHUB_EVENT_NAME}"

          INPUT_LABEL="${{ github.event.inputs.release_label }}"
          INPUT_PUBLISH="${{ github.event.inputs.publish_telegram }}"

          RELEASE_LABEL=""
          PUBLISH_TELEGRAM=false

          if [ "$EVENT_NAME" = "schedule" ]; then
            RELEASE_LABEL="nightly-$(date -u +%Y%m%d)"
            PUBLISH_TELEGRAM=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_LABEL" ]; then
              RELEASE_LABEL="$INPUT_LABEL"
            else
              RELEASE_LABEL="manual-v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
            fi

            if [ "$INPUT_PUBLISH" = "false" ]; then
              PUBLISH_TELEGRAM=false
            else
              PUBLISH_TELEGRAM=true
            fi
          else
            # push master: artifact only, no Telegram spam
            RELEASE_LABEL="ci-master-${GITHUB_RUN_NUMBER}"
            PUBLISH_TELEGRAM=false
          fi

          if [ "$PUBLISH_TELEGRAM" = "true" ]; then
            BUILD_KIND="signed-internal"
            VERSION_CODE=$(date -u +%y%j%H%M)
            VERSION_NAME="internal-${APP_VERSION}"
            APK_SOURCE_PATH="${RELEASE_APK_OUTPUT_PATH}"
          else
            BUILD_KIND="debug"
            VERSION_CODE=""
            VERSION_NAME=""
            APK_SOURCE_PATH="${DEBUG_APK_OUTPUT_PATH}"
          fi

          SAFE_RELEASE_LABEL=$(echo "$RELEASE_LABEL" | tr -cs 'A-Za-z0-9._-' '-')
          FILE_NAME="burlive-${SAFE_RELEASE_LABEL}-${BUILD_KIND}-${SHORT_SHA}.apk"

          {
            echo "app_version=$APP_VERSION"
            echo "release_label=$RELEASE_LABEL"
            echo "safe_release_label=$SAFE_RELEASE_LABEL"
            echo "short_sha=$SHORT_SHA"
            echo "publish_telegram=$PUBLISH_TELEGRAM"
            echo "build_kind=$BUILD_KIND"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "apk_source_path=$APK_SOURCE_PATH"
            echo "file_name=$FILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets (signed internal only)
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          required=(
            ANDROID_KEYSTORE_B64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required signing secret: ${key}"
              exit 1
            fi
          done

      - name: Decode Android keystore (signed internal only)
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build signed internal APK (Telegram path)
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          ORG_GRADLE_PROJECT_BURLIVE_UPLOAD_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_BURLIVE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BURLIVE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BURLIVE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_BURLIVE_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ORG_GRADLE_PROJECT_BURLIVE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -e
          npm run android:build:release
          cp "${{ steps.meta.outputs.apk_source_path }}" "${{ steps.meta.outputs.file_name }}"

      - name: Build debug APK (artifact-only path)
        if: steps.meta.outputs.publish_telegram != 'true'
        run: |
          set -e
          npm run android:build:debug
          cp "${{ steps.meta.outputs.apk_source_path }}" "${{ steps.meta.outputs.file_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.file_name }}
          path: ${{ steps.meta.outputs.file_name }}
          if-no-files-found: error

      - name: Resolve Telegram target + preflight
        if: steps.meta.outputs.publish_telegram == 'true'
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_INTERNAL: ${{ secrets.TELEGRAM_CHAT_ID_INTERNAL }}
          TELEGRAM_THREAD_ID_INTERNAL: ${{ secrets.TELEGRAM_THREAD_ID_INTERNAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail

          CHAT_ID="${TELEGRAM_CHAT_ID_INTERNAL:-$TELEGRAM_CHAT_ID}"
          THREAD_ID="${TELEGRAM_THREAD_ID_INTERNAL:-$TELEGRAM_THREAD_ID}"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or chat id secret"
            exit 1
          fi

          URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat"
          RESP=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -X POST "$URL" -d "chat_id=${CHAT_ID}")
          echo "$RESP"
          echo "$RESP" | jq -e '.ok == true' >/dev/null
          ACTUAL_CHAT_ID=$(echo "$RESP" | jq -r '.result.id | tostring')

          if [ "$ACTUAL_CHAT_ID" != "$CHAT_ID" ]; then
            echo "Telegram preflight mismatch: expected chat_id=$CHAT_ID, got $ACTUAL_CHAT_ID"
            exit 1
          fi

          {
            echo "chat_id=$CHAT_ID"
            echo "thread_id=$THREAD_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram build message
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.tg.outputs.chat_id }}
          THREAD_ID: ${{ steps.tg.outputs.thread_id }}
        run: |
          set -euo pipefail

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE=$(printf "📦 Burlive Android build\n\nLabel: %s\nKind: %s\nVersion: %s\nVersionCode: %s\nCommit: %s\nEvent: %s\nWorkflow: %s" \
            "${{ steps.meta.outputs.release_label }}" \
            "${{ steps.meta.outputs.build_kind }}" \
            "${{ steps.meta.outputs.version_name }}" \
            "${{ steps.meta.outputs.version_code }}" \
            "${{ steps.meta.outputs.short_sha }}" \
            "${GITHUB_EVENT_NAME}" \
            "${RUN_URL}")

          URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          for attempt in 1 2 3; do
            if [ -n "$THREAD_ID" ]; then
              RESP=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -X POST "$URL" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_thread_id=${THREAD_ID}" \
                --data-urlencode "text=${MESSAGE}")
            else
              RESP=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -X POST "$URL" \
                -d "chat_id=${CHAT_ID}" \
                --data-urlencode "text=${MESSAGE}")
            fi

            echo "$RESP"
            OK=$(echo "$RESP" | jq -r '.ok // false')
            RESP_CHAT_ID=$(echo "$RESP" | jq -r '.result.chat.id // empty | tostring')

            if [ "$OK" = "true" ] && [ "$RESP_CHAT_ID" = "$CHAT_ID" ]; then
              exit 0
            fi

            echo "Telegram sendMessage attempt $attempt failed"
            sleep 2
          done

          echo "Telegram sendMessage failed after retries"
          exit 1

      - name: Send APK to Telegram
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.tg.outputs.chat_id }}
          THREAD_ID: ${{ steps.tg.outputs.thread_id }}
        run: |
          set -euo pipefail

          URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          CAPTION="Burlive ${{ steps.meta.outputs.build_kind }} APK • ${{ steps.meta.outputs.release_label }} • ${{ steps.meta.outputs.short_sha }}"

          for attempt in 1 2 3; do
            if [ -n "$THREAD_ID" ]; then
              RESP=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -X POST "$URL" \
                -F "chat_id=${CHAT_ID}" \
                -F "message_thread_id=${THREAD_ID}" \
                -F "caption=${CAPTION}" \
                -F "document=@${{ steps.meta.outputs.file_name }}")
            else
              RESP=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -X POST "$URL" \
                -F "chat_id=${CHAT_ID}" \
                -F "caption=${CAPTION}" \
                -F "document=@${{ steps.meta.outputs.file_name }}")
            fi

            echo "$RESP"
            OK=$(echo "$RESP" | jq -r '.ok // false')
            RESP_CHAT_ID=$(echo "$RESP" | jq -r '.result.chat.id // empty | tostring')

            if [ "$OK" = "true" ] && [ "$RESP_CHAT_ID" = "$CHAT_ID" ]; then
              exit 0
            fi

            echo "Telegram sendDocument attempt $attempt failed"
            sleep 2
          done

          echo "Telegram sendDocument failed after retries"
          exit 1
