name: Android Debug APK (artifact + optional Telegram)

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Optional custom label (e.g. beta-2026-03-01)'
        required: false
        type: string
      publish_telegram:
        description: 'Send debug APK to Telegram'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - master
  schedule:
    # Nightly build (UTC)
    - cron: '15 2 * * *'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      APK_OUTPUT_PATH: android/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Prepare build metadata
        id: meta
        run: |
          set -e

          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          EVENT_NAME="${GITHUB_EVENT_NAME}"

          INPUT_LABEL="${{ github.event.inputs.release_label }}"
          INPUT_PUBLISH="${{ github.event.inputs.publish_telegram }}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            RELEASE_LABEL="nightly-$(date -u +%Y%m%d)"
            PUBLISH_TELEGRAM=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_LABEL" ]; then
              RELEASE_LABEL="$INPUT_LABEL"
            else
              RELEASE_LABEL="manual-v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
            fi
            if [ "$INPUT_PUBLISH" = "false" ]; then
              PUBLISH_TELEGRAM=false
            else
              PUBLISH_TELEGRAM=true
            fi
          else
            # push master: artifact only, no Telegram spam
            RELEASE_LABEL="ci-master-${GITHUB_RUN_NUMBER}"
            PUBLISH_TELEGRAM=false
          fi

          FILE_NAME="burlive-${RELEASE_LABEL}-${SHORT_SHA}.apk"

          {
            echo "app_version=$APP_VERSION"
            echo "release_label=$RELEASE_LABEL"
            echo "short_sha=$SHORT_SHA"
            echo "file_name=$FILE_NAME"
            echo "publish_telegram=$PUBLISH_TELEGRAM"
          } >> "$GITHUB_OUTPUT"

          cp "$APK_OUTPUT_PATH" "$FILE_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.file_name }}
          path: ${{ steps.meta.outputs.file_name }}
          if-no-files-found: error

      - name: Send Telegram debug build message
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_INTERNAL: ${{ secrets.TELEGRAM_CHAT_ID_INTERNAL }}
          TELEGRAM_THREAD_ID_INTERNAL: ${{ secrets.TELEGRAM_THREAD_ID_INTERNAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -e

          CHAT_ID="${TELEGRAM_CHAT_ID_INTERNAL:-$TELEGRAM_CHAT_ID}"
          THREAD_ID="${TELEGRAM_THREAD_ID_INTERNAL:-$TELEGRAM_THREAD_ID}"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or chat id secret"
            exit 1
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE=$(printf "📦 Burlive Android DEBUG build\n\nLabel: %s\nVersion: %s\nCommit: %s\nEvent: %s\nWorkflow: %s" \
            "${{ steps.meta.outputs.release_label }}" \
            "${{ steps.meta.outputs.app_version }}" \
            "${{ steps.meta.outputs.short_sha }}" \
            "${GITHUB_EVENT_NAME}" \
            "${RUN_URL}")

          URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          if [ -n "$THREAD_ID" ]; then
            RESP=$(curl -sS -X POST "$URL" \
              -d "chat_id=${CHAT_ID}" \
              -d "message_thread_id=${THREAD_ID}" \
              --data-urlencode "text=${MESSAGE}")
          else
            RESP=$(curl -sS -X POST "$URL" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}")
          fi

          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

      - name: Send debug APK to Telegram
        if: steps.meta.outputs.publish_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_INTERNAL: ${{ secrets.TELEGRAM_CHAT_ID_INTERNAL }}
          TELEGRAM_THREAD_ID_INTERNAL: ${{ secrets.TELEGRAM_THREAD_ID_INTERNAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -e

          CHAT_ID="${TELEGRAM_CHAT_ID_INTERNAL:-$TELEGRAM_CHAT_ID}"
          THREAD_ID="${TELEGRAM_THREAD_ID_INTERNAL:-$TELEGRAM_THREAD_ID}"

          URL="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          CAPTION="Burlive DEBUG APK • ${{ steps.meta.outputs.release_label }} • ${{ steps.meta.outputs.short_sha }}"

          if [ -n "$THREAD_ID" ]; then
            RESP=$(curl -sS -X POST "$URL" \
              -F "chat_id=${CHAT_ID}" \
              -F "message_thread_id=${THREAD_ID}" \
              -F "caption=${CAPTION}" \
              -F "document=@${{ steps.meta.outputs.file_name }}")
          else
            RESP=$(curl -sS -X POST "$URL" \
              -F "chat_id=${CHAT_ID}" \
              -F "caption=${CAPTION}" \
              -F "document=@${{ steps.meta.outputs.file_name }}")
          fi

          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'
