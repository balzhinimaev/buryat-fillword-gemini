name: Verified release image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_VK_CLIENT_ID=${{ vars.VITE_VK_CLIENT_ID }}
            VITE_VK_REDIRECT_URI=${{ vars.VITE_VK_REDIRECT_URI || 'https://buryat-game.ru/auth/vk/callback' }}
